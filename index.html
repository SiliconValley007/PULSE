<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>PULSE — News in motion</title>
    <meta
      name="description"
      content="Live vertical short-form news. Swipe, listen, read, save."
    />
    <meta name="theme-color" content="#090a0f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..1000&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./data/fallback-feed.js"></script>
    <script defer src="./app.js"></script>
  </head>
  <body>
    <div class="stage" id="stage">
      <main id="feed" class="feed-container" aria-live="polite"></main>

      <header class="top">
        <div class="prog"><i id="prog"></i></div>
        <div class="row">
          <div class="brand">
            <b>PULSE</b><span id="ctx">For You • Top Stories</span>
          </div>
          <span id="live" class="live">• UPDATED</span>
          <button class="ico" data-action="open-search" aria-label="Search">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="6.5" />
              <path d="M16 16l4.5 4.5" />
            </svg>
          </button>
          <button
            class="ico"
            data-action="open-saved"
            aria-label="Saved stories"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M6.5 3.5h11a1 1 0 0 1 1 1V21l-6.5-4-6.5 4V4.5a1 1 0 0 1 1-1z"
              />
            </svg>
            <i id="saved-count" hidden>0</i>
          </button>
          <button class="ico" data-action="refresh" aria-label="Refresh">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 11a8 8 0 1 0-2.3 5.7" />
              <path d="M20 4v7h-7" />
            </svg>
          </button>
        </div>
        <div class="sub">
          <span id="streak" class="dpill" title="Daily Pulse streak">🔥 0d</span>
          <span
            class="loc"
            id="location-badge"
            role="button"
            tabindex="0"
            data-action="open-loc"
            aria-label="Change city"
            style="cursor: pointer"
            title="Change city"
            hidden
            >📍 Set City</span
          >
        </div>
        <nav
          class="chips category-bar"
          id="chips"
          aria-label="Categories"
        ></nav>
      </header>

      <aside class="rail" aria-label="Story actions">
        <button data-action="listen" aria-label="Listen">
          <span class="ib"
            ><svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" />
              <path class="w" d="M15.5 9a4 4 0 0 1 0 6" />
              <path class="w" d="M18 6.5a7.5 7.5 0 0 1 0 11" /></svg></span
          ><small>Listen</small>
        </button>
        <button data-action="read" aria-label="Read full source">
          <span class="ib"
            ><svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M3.5 5.5c3-1 6-.8 8.5 1 2.5-1.8 5.5-2 8.5-1v13c-3-1-6-.8-8.5 1-2.5-1.8-5.5-2-8.5-1z"
              />
              <path d="M12 6.5v13" /></svg></span
          ><small>Read</small>
        </button>
        <button data-action="save" aria-label="Save story">
          <span class="ib"
            ><svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M6.5 3.5h11a1 1 0 0 1 1 1V21l-6.5-4-6.5 4V4.5a1 1 0 0 1 1-1z"
              /></svg></span
          ><small>Save</small>
        </button>
        <button data-action="share" aria-label="Share">
          <span class="ib"
            ><svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="18" cy="5.5" r="2.5" />
              <circle cx="6" cy="12" r="2.5" />
              <circle cx="18" cy="18.5" r="2.5" />
              <path d="M8.2 10.8l7.6-4M8.2 13.2l7.6 4" /></svg></span
          ><small>Share</small>
        </button>
        <button class="desk" data-action="prev" aria-label="Previous">
          <span class="ib"
            ><svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 14l6-6 6 6" /></svg
          ></span>
        </button>
        <button class="desk" data-action="next" aria-label="Next">
          <span class="ib"
            ><svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 10l6 6 6-6" /></svg
          ></span>
        </button>
      </aside>

      <div id="toast" role="status"></div>
      <div id="geo" role="status" hidden>
        <span id="geo-txt"></span><button data-action="geo-yes">Switch</button
        ><button data-action="geo-no" aria-label="Dismiss">✕</button>
      </div>

      <div class="modal" id="savedmodal" data-action="close">
        <section
          class="sheet"
          role="dialog"
          aria-modal="true"
          aria-label="Saved stories"
        >
          <div class="shead">
            <h3>Saved stories</h3>
            <div class="sh-actions">
              <button
                id="saved-clear"
                class="txtbtn"
                data-action="saved-clear"
                hidden
              >
                Clear all</button
              ><button data-action="close" aria-label="Close">✕</button>
            </div>
          </div>
          <div id="saved-list" class="saved-list"></div>
        </section>
      </div>

      <div class="modal" id="reader" data-action="close">
        <section
          class="sheet"
          role="dialog"
          aria-modal="true"
          aria-label="Full story"
        >
          <div class="shead">
            <h3 id="rd-title"></h3>
            <button data-action="close" aria-label="Close">✕</button>
          </div>
          <div id="rd-meta" class="rd-meta"></div>
          <div id="rd-body" class="rd-body"></div>
          <a
            id="rd-ext"
            class="rd-ext"
            target="_blank"
            rel="noopener noreferrer"
            >Read full story at source ↗</a
          >
        </section>
      </div>

      <div class="modal" id="searchmodal" data-action="close">
        <section
          class="sheet"
          role="dialog"
          aria-modal="true"
          aria-label="Search"
        >
          <div class="shead">
            <h3>Search live news</h3>
            <button data-action="close" aria-label="Close">✕</button>
          </div>
          <div class="qrow">
            <input
              id="search-q"
              type="search"
              placeholder="Mumbai, AI, Cricket, Formula 1…"
              aria-label="Search live news"
            />
            <button class="go" data-action="run-search">Go</button>
          </div>
          <div class="sugs">
            <button data-action="run-search" data-q="Mumbai" data-kind="city">
              Mumbai
            </button>
            <button data-action="run-search" data-q="Delhi" data-kind="city">
              Delhi
            </button>
            <button data-action="run-search" data-q="AI">AI</button>
            <button data-action="run-search" data-q="Cricket">Cricket</button>
            <button data-action="run-search" data-q="Formula 1">
              Formula 1
            </button>
            <button data-action="run-search" data-q="Stock Market">
              Stock Market
            </button>
            <button data-action="run-search" data-q="Space">Space</button>
          </div>
        </section>
      </div>

      <div class="modal" id="locmodal" data-action="close">
        <section
          class="sheet"
          role="dialog"
          aria-modal="true"
          aria-label="Change city"
        >
          <div class="shead">
            <h3>Change your city</h3>
            <button data-action="close" aria-label="Close">✕</button>
          </div>
          <p class="cur">Local feed: <b id="loc-cur">not set</b></p>
          <div class="qrow">
            <input
              id="loc-q"
              type="search"
              placeholder="Type any city or place…"
              aria-label="City"
            />
            <button class="go" data-action="set-city">Save</button>
          </div>
          <div id="loc-grid" class="sugs"></div>
          <button class="big alt" data-action="detect-gps">
            📍 Use my current location
          </button>
        </section>
      </div>
    </div>
  </body>
</html>
