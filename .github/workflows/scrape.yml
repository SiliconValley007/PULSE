name: Refresh PULSE feed
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'scripts/scrape.mjs'
permissions:
  contents: write
concurrency:
  group: pulse-scrape
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Scrape live feeds
        run: node scripts/scrape.mjs
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fallback-feed.json data/fallback-feed.js
          git diff --staged --quiet || (git commit -m "chore(feed): automated live news snapshot" && git pull --rebase && git push)
