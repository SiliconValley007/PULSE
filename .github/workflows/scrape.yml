name: Refresh PULSE feed
on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pulse-scrape
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Scrape live feeds
        run: node scripts/scrape.mjs
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fallback-feed.json data/fallback-feed.js
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore(feed): automated live news snapshot"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
